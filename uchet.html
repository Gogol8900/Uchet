<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Учёт бизнеса</title>
<style>
:root{--bg:#f2f4f5;--card:#fff;--tx:#1c2a2e;--mut:#6b7a80;--bd:#e3e8ea;--ac:#2f7571;--acx:#fff;--in:#2f7d5b;--out:#c0603f;--sh:#eaf2f1;--nv:#fff;--nt:#475a60;--sd:0 2px 10px #1c2a2e12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101619;--card:#182226;--tx:#e6eef0;--mut:#8aa0a6;--bd:#243238;--ac:#4fb3ab;--acx:#07201e;--in:#6cc59b;--out:#e59a7c;--sh:#1e2f33;--nv:#141d20;--nt:#a6bbc0;--sd:0 2px 10px #0006}}
:root[data-theme=dark]{--bg:#101619;--card:#182226;--tx:#e6eef0;--mut:#8aa0a6;--bd:#243238;--ac:#4fb3ab;--acx:#07201e;--in:#6cc59b;--out:#e59a7c;--sh:#1e2f33;--nv:#141d20;--nt:#a6bbc0;--sd:0 2px 10px #0006}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:210px 1fr;min-height:100%}
nav{background:var(--nv);color:var(--nt);border-right:1px solid var(--bd);padding:24px 14px;position:sticky;top:0;height:100vh}
nav h1{font-size:18px;font-weight:700;color:var(--ac);margin:0 10px 22px;line-height:1.2}nav h1 small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:3px}
nav button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--nt);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;margin-bottom:3px}
nav button.on{background:var(--sh);color:var(--ac);font-weight:600}nav button:not(.on):hover{background:var(--sh)}
main{padding:22px;max-width:980px;width:100%}
h2{margin:0 0 14px;font-size:24px;font-weight:700;letter-spacing:-.01em}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar h2{margin:0;margin-right:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--sd)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:var(--sd)}.kpi span{color:var(--mut);font-size:13px}.kpi b{display:block;font-size:22px;font-weight:700;margin-top:3px}
.in{color:var(--in)}.out{color:var(--out)}.mut{color:var(--mut)}
button.p,button.g,button.d{font:inherit;border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}button.d{color:var(--out)}
button.i{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:4px 7px;border-radius:6px}button.i:hover{background:var(--sh)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%}
.bar input,.bar select{width:auto;flex:1;min-width:120px}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .m{flex:1;min-width:0}.row .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .a{font-weight:600;white-space:nowrap}
.cb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.cb i{display:block;height:9px;border-radius:5px;background:var(--out)}.cb span:first-child{width:96px}
dialog{border:1px solid var(--bd);box-shadow:0 16px 48px #0003;border-radius:18px;background:var(--card);color:var(--tx);width:min(420px,94vw);padding:18px}dialog::backdrop{background:#0008}
dialog h3{margin:0 0 12px}dialog label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}dialog .r{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}.tag{font-size:12px;background:var(--sh);border-radius:999px;padding:1px 9px;color:var(--ac)}
@media(max-width:720px){#app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--bd);z-index:5}
nav h1{display:none}nav button{flex-direction:column;align-items:center;gap:0;font-size:11px;padding:6px 2px;text-align:center;margin:0}main{padding:14px 12px 96px}}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog>
<script>
const KEY='uchet-biz-v1',$=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const blank=()=>({set:{name:'Мой бизнес',cur:'₽',theme:''},tx:[],parties:[],items:[]});
let S=blank();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ui={tab:'dash',q:'',ft:'all',mo:'',per:'m'};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n||0)+' '+S.set.cur;
const pname=id=>(S.parties.find(p=>p.id===id)||{}).name||'';
const TABS=[['dash','Обзор','📊'],['tx','Операции','💳'],['items','Товары','📦'],['parties','Напарники','🤝'],['set','Настройки','⚙️']];
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);

function dlgOpen(h){const d=$('#dlg');d.innerHTML=h;d.showModal();return d}
function form(title,fields,v,onSave){
  v=v||{};
  const h=fields.map(f=>{let c;const val=v[f.k]!=null?v[f.k]:(f.def!=null?f.def:'');
    if(f.t==='sel')c=`<select name="${f.k}">${f.o.map(o=>`<option value="${E(o[0])}"${o[0]==val?' selected':''}>${E(o[1])}</option>`).join('')}</select>`;
    else if(f.t==='area')c=`<textarea name="${f.k}" rows="2">${E(val)}</textarea>`;
    else c=`<input name="${f.k}" type="${f.t==='num'?'number':f.t||'text'}" ${f.t==='num'?'step="any" min="0"':''} value="${E(val)}" ${f.req?'required':''} ${f.dl?'list="'+f.dl+'"':''}>`;
    return `<label>${f.l}</label>${c}`}).join('');
  const d=dlgOpen(`<form><h3>${title}</h3>${h}<datalist id="cats">${['Продажи','Услуги','Закупки','Аренда','Зарплата','Реклама','Налоги','Транспорт','Прочее'].map(c=>`<option>${c}</option>`).join('')}</datalist><div class="r"><button type="button" class="g" onclick="dlg.close()">Отмена</button><button class="p">Сохранить</button></div></form>`);
  d.querySelector('form').onsubmit=e=>{e.preventDefault();const o={};fields.forEach(f=>{let x=e.target.elements[f.k].value;if(f.t==='num')x=parseFloat(x)||0;o[f.k]=x});onSave(o);d.close();save();render()};
}
function ask(text,fn){const d=dlgOpen(`<h3>${text}</h3><div class="r"><button class="g" onclick="dlg.close()">Отмена</button><button class="d" id="yes">Удалить</button></div>`);$('#yes').onclick=()=>{fn();d.close();save();render()}}

function txForm(id,type){
  const t=S.tx.find(x=>x.id===id)||{type:type||'in',date:today()};
  form(id?'Изменить операцию':(t.type==='in'?'Новый доход':'Новый расход'),[
    {k:'type',l:'Тип',t:'sel',o:[['in','Доход'],['out','Расход']]},{k:'date',l:'Дата',t:'date',req:1},{k:'amt',l:'Сумма',t:'num',req:1},
    {k:'cat',l:'Категория',dl:'cats'},{k:'party',l:'Напарник или клиент',t:'sel',o:[['','—']].concat(S.parties.map(p=>[p.id,p.name]))},{k:'note',l:'Комментарий',t:'area'}],t,
    o=>{if(id)Object.assign(t,o);else S.tx.push(Object.assign({id:uid()},o))});
}
function itemForm(id){
  const t=S.items.find(x=>x.id===id)||{};
  form(id?'Изменить товар':'Новый товар или услуга',[{k:'name',l:'Название',req:1},{k:'price',l:'Цена продажи',t:'num'},{k:'cost',l:'Себестоимость',t:'num'},{k:'qty',l:'Остаток на складе',t:'num'}],t,
    o=>{if(id)Object.assign(t,o);else S.items.push(Object.assign({id:uid()},o))});
}
function partyForm(id){
  const t=S.parties.find(x=>x.id===id)||{};
  form(id?'Изменить напарника':'Новый напарник',[{k:'name',l:'Имя или название',req:1},{k:'kind',l:'Роль',t:'sel',o:[['partner','Напарник'],['client','Клиент'],['supplier','Поставщик']]},{k:'pct',l:'Доля от прибыли, %',t:'num'},{k:'phone',l:'Телефон или e-mail'},{k:'note',l:'Заметка',t:'area'}],t,
    o=>{if(id)Object.assign(t,o);else S.parties.push(Object.assign({id:uid()},o))});
}
const PAYC='Выплата доли';
const base=l=>sum(l,'in')-l.filter(x=>x.type==='out'&&x.cat!==PAYC).reduce((s,x)=>s+x.amt,0);
const accr=(p,l)=>Math.max(0,base(l))*(p.pct||0)/100;
const paid=p=>S.tx.filter(x=>x.party===p.id&&x.cat===PAYC).reduce((s,x)=>s+x.amt,0);
function payout(id){const p=S.parties.find(x=>x.id===id),d=Math.max(0,accr(p,S.tx)-paid(p));form('Выплата: '+E(p.name),[{k:'amt',l:'Сумма',t:'num',def:Math.round(d*100)/100,req:1},{k:'date',l:'Дата',t:'date',def:today(),req:1},{k:'note',l:'Комментарий'}],{},o=>{if(o.amt>0)S.tx.push({id:uid(),type:'out',date:o.date,amt:o.amt,cat:PAYC,party:id,note:o.note})})}
function sell(id){
  const it=S.items.find(x=>x.id===id);
  form('Продать: '+E(it.name),[{k:'n',l:'Количество',t:'num',def:1,req:1},{k:'party',l:'Покупатель',t:'sel',o:[['','—']].concat(S.parties.map(p=>[p.id,p.name]))},{k:'date',l:'Дата',t:'date',def:today()}],{},
    o=>{const n=Math.min(o.n,it.qty);if(n<=0)return;it.qty-=n;S.tx.push({id:uid(),type:'in',date:o.date,amt:n*it.price,cat:'Продажи',party:o.party,note:it.name+' × '+n})});
}
const del=(arr,id,txt)=>ask(txt,()=>{S[arr]=S[arr].filter(x=>x.id!==id)});

function dash(){
  const m=today().slice(0,7),list=ui.per==='m'?S.tx.filter(x=>x.date.startsWith(m)):S.tx;
  const inc=sum(list,'in'),exp=list.filter(x=>x.type==='out'&&x.cat!==PAYC).reduce((s,x)=>s+x.amt,0),sh=S.parties.reduce((s,p)=>s+accr(p,list),0),stock=S.items.reduce((s,i)=>s+i.qty*i.cost,0);
  const mk=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return{k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleString('ru',{month:'short'})}});
  const data=mk.map(x=>{const a=S.tx.filter(t=>t.date.startsWith(x.k));return[sum(a,'in'),sum(a,'out')]});
  const mx=Math.max(1,...data.flat());
  const svg=`<svg viewBox="0 0 600 160" width="100%" role="img" aria-label="Доходы и расходы за 6 месяцев">${data.map((d,i)=>{const x=i*100+14,h1=d[0]/mx*110,h2=d[1]/mx*110;return `<rect x="${x}" y="${130-h1}" width="34" height="${h1}" rx="3" fill="var(--in)"/><rect x="${x+38}" y="${130-h2}" width="34" height="${h2}" rx="3" fill="var(--out)"/><text x="${x+36}" y="150" text-anchor="middle" font-size="12" fill="var(--mut)">${mk[i].l}</text>`}).join('')}</svg>`;
  const cats={};list.filter(x=>x.type==='out').forEach(x=>{const c=x.cat||'Без категории';cats[c]=(cats[c]||0)+x.amt});
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6),cm=cl.length?cl[0][1]:1;
  const low=S.items.filter(i=>i.qty<=0&&S.items.length).length;
  return `<div class="bar"><h2>Обзор</h2><select onchange="ui.per=this.value;render()" style="flex:none"><option value="m"${ui.per==='m'?' selected':''}>Этот месяц</option><option value="a"${ui.per==='a'?' selected':''}>Всё время</option></select><button class="p" onclick="txForm(0,'in')">+ Доход</button><button class="d" onclick="txForm(0,'out')">+ Расход</button></div>
  <div class="kpis"><div class="kpi"><span>Доходы</span><b class="in">${money(inc)}</b></div><div class="kpi"><span>Расходы</span><b class="out">${money(exp)}</b></div><div class="kpi"><span>Прибыль</span><b>${money(inc-exp)}</b></div><div class="kpi"><span>Доли напарников</span><b>${money(sh)}</b></div><div class="kpi"><span>Остаётся вам</span><b>${money(inc-exp-sh)}</b></div><div class="kpi"><span>Склад по себестоимости</span><b>${money(stock)}</b></div></div>
  <div class="card"><b>Последние 6 месяцев</b> <span class="mut">· зелёный — доход, оранжевый — расход</span>${svg}</div>
  <div class="card"><b>Куда уходят деньги</b>${cl.length?cl.map(c=>`<div class="cb"><span>${E(c[0])}</span><i style="width:${Math.max(3,c[1]/cm*55)}%"></i><span>${money(c[1])}</span></div>`).join(''):'<div class="empty">Расходов за период пока нет.</div>'}</div>
  <div class="card"><b>Недавние операции</b>${S.tx.length?txRows(S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5),1):'<div class="empty">Добавьте первый доход или расход — кнопки сверху.<br><br><button class="g" onclick="demo()">Заполнить примером</button></div>'}</div>`;
}
function txRows(l,ro){return l.map(x=>`<div class="row"><div class="m"><div><b>${E(x.cat||'Без категории')}</b> ${x.party?`<span class="tag">${E(pname(x.party))}</span>`:''}</div><div class="mut">${x.date.split('-').reverse().join('.')}${x.note?' · '+E(x.note):''}</div></div><div class="a ${x.type}">${x.type==='in'?'+':'−'}${money(x.amt)}</div>${ro?'':`<button class="i" title="Изменить" onclick="txForm('${x.id}')">✎</button><button class="i" title="Удалить" onclick="del('tx','${x.id}','Удалить операцию?')">✕</button>`}</div>`).join('')}
function txView(){
  const q=ui.q.toLowerCase();
  const l=S.tx.filter(x=>(ui.ft==='all'||x.type===ui.ft)&&(!ui.mo||x.date.startsWith(ui.mo))&&(!q||(x.cat+' '+x.note+' '+pname(x.party)).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="bar"><h2>Операции</h2><button class="g" onclick="pdf()">📄 PDF</button><button class="p" onclick="txForm(0,'in')">+ Доход</button><button class="d" onclick="txForm(0,'out')">+ Расход</button></div>
  <div class="bar"><input id="q" placeholder="Поиск по категории, комментарию, напарнику" value="${E(ui.q)}" oninput="ui.q=this.value;render(1)"><select onchange="ui.ft=this.value;render()"><option value="all">Все</option><option value="in"${ui.ft==='in'?' selected':''}>Доходы</option><option value="out"${ui.ft==='out'?' selected':''}>Расходы</option></select><input type="month" value="${ui.mo}" onchange="ui.mo=this.value;render()"></div>
  <div class="card">${l.length?txRows(l):'<div class="empty">Ничего не найдено.</div>'}</div>
  <div class="mut">Показано: ${l.length} · доход ${money(sum(l,'in'))} · расход ${money(sum(l,'out'))} · итог ${money(sum(l,'in')-sum(l,'out'))}</div>`;
}
function itemsView(){
  return `<div class="bar"><h2>Товары и услуги</h2><button class="p" onclick="itemForm()">+ Добавить</button></div><div class="card">${S.items.length?S.items.map(i=>`<div class="row"><div class="m"><div><b>${E(i.name)}</b></div><div class="mut">Цена ${money(i.price)} · себестоимость ${money(i.cost)} · маржа ${i.price?Math.round((i.price-i.cost)/i.price*100):0}%</div></div><div class="a ${i.qty<=0?'out':''}">${i.qty<=0?'нет в наличии':i.qty+' шт.'}</div><button class="g" ${i.qty<=0?'disabled':''} onclick="sell('${i.id}')">Продать</button><button class="i" title="Изменить" onclick="itemForm('${i.id}')">✎</button><button class="i" title="Удалить" onclick="del('items','${i.id}','Удалить товар?')">✕</button></div>`).join(''):'<div class="empty">Добавьте товары или услуги. Кнопка «Продать» сама спишет остаток и создаст доход.</div>'}</div>`;
}
function partiesView(){
  return `<div class="bar"><h2>Напарники</h2><button class="p" onclick="partyForm()">+ Добавить</button></div><div class="mut" style="margin-bottom:10px">Прибыль без учёта выплат: ${money(base(S.tx))}. Доли считаются от неё.</div><div class="card">${S.parties.length?S.parties.map(p=>{const ac=accr(p,S.tx),pd=paid(p),left=Math.max(0,ac-pd);return `<div class="row"><div class="m"><div><b>${E(p.name)}</b> <span class="tag">${{partner:'напарник',supplier:'поставщик',client:'клиент'}[p.kind]||'напарник'}</span> <span class="tag">${p.pct||0}%</span></div><div class="mut">${p.pct?`начислено ${money(ac)} · выплачено ${money(pd)}`:E(p.phone||'без доли')}${p.note?' · '+E(p.note):''}</div></div><div class="a">${p.pct?money(left):''}</div>${left>0?`<button class="g" onclick="payout('${p.id}')">Выплатить</button>`:''}<button class="i" title="Изменить" onclick="partyForm('${p.id}')">✎</button><button class="i" title="Удалить" onclick="del('parties','${p.id}','Удалить напарника?')">✕</button></div>`}).join(''):'<div class="empty">Добавьте напарников и укажите долю от прибыли в процентах. Приложение посчитает, сколько кому причитается, и запишет выплаты.</div>'}</div>`;
}
function setView(){
  return `<h2>Настройки</h2><div class="card"><label class="mut">Название бизнеса</label><input value="${E(S.set.name)}" onchange="S.set.name=this.value;save();render()"><label class="mut" style="display:block;margin-top:10px">Валюта</label><select onchange="S.set.cur=this.value;save();render()">${['₽','$','€','TMT','₸','₴','Br','сом','сум'].map(c=>`<option${c===S.set.cur?' selected':''}>${c}</option>`).join('')}</select><label class="mut" style="display:block;margin-top:10px">Тема</label><select onchange="S.set.theme=this.value;save();render()"><option value="">Как в системе</option><option value="light"${S.set.theme==='light'?' selected':''}>Светлая</option><option value="dark"${S.set.theme==='dark'?' selected':''}>Тёмная</option></select></div>
  <div class="card"><b>Резервная копия</b><p class="mut">Данные хранятся в этом браузере. Скопируйте копию в надёжное место или вставьте её, чтобы восстановить.</p><div class="bar"><button class="p" onclick="pdf()">📄 Сохранить в PDF</button><button class="g" onclick="backup()">Копия и восстановление</button><button class="g" onclick="csv()">Таблица CSV</button><button class="d" onclick="ask('Стереть все данные?',()=>{S=blank()})">Стереть всё</button></div></div>`;
}
function backup(){const d=dlgOpen(`<h3>Копия данных</h3><textarea id="bk" rows="8" style="font-size:12px">${E(JSON.stringify(S))}</textarea><div class="r"><button class="g" onclick="dlg.close()">Закрыть</button><button class="p" id="ld">Восстановить из текста</button></div>`);
  $('#ld').onclick=()=>{try{S=Object.assign(blank(),JSON.parse($('#bk').value));d.close();save();render()}catch(e){alert('Текст не похож на копию данных.')}}}
function csv(){const r=['Дата;Тип;Сумма;Категория;Напарник;Комментарий'].concat(S.tx.map(x=>[x.date,x.type==='in'?'Доход':'Расход',x.amt,x.cat,pname(x.party),x.note].map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')));

let DL=null;try{claude.use('downloads').then(d=>DL=d,()=>{})}catch(e){}
function pdf(){
 const W=1240,H=1754,M=80,ink='#14213d',mut='#667085',G='#15803d',R='#c2410c',pg=[];let c,x,y;
 const np=()=>{c=document.createElement('canvas');c.width=W;c.height=H;x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);pg.push(c);y=M+20};
 const fit=(t,w)=>{t=String(t||'');while(t.length>1&&x.measureText(t).width>w)t=t.slice(0,-2)+'…';return t};
 const ln=(cols,o={})=>{if(y>H-M-30)np();x.font=(o.b?'bold ':'')+(o.s||24)+'px system-ui,Arial,sans-serif';cols.forEach(k=>{x.fillStyle=k[3]||o.c||ink;x.textAlign=k[2]||'left';x.fillText(fit(k[0],k[4]||900),k[1],y)});y+=o.h||36};
 const sec=t=>{y+=26;ln([[t,M]],{b:1,s:30,h:44});x.fillStyle='#dde2e8';x.fillRect(M,y-30,W-2*M,2)};
 const dm=d=>d.split('-').reverse().join('.');
 np();
 ln([[S.set.name,M]],{b:1,s:44,h:56});
 ln([['Отчёт на '+dm(today()),M,'left',mut]],{h:50});
 const I=sum(S.tx,'in'),O=sum(S.tx,'out');
 ln([['Доходы',M],[money(I),W-M,'right',G]]);
 ln([['Расходы',M],[money(O),W-M,'right',R]]);
 ln([['Прибыль',M],[money(I-O),W-M,'right']],{b:1});
 ln([['Склад по себестоимости',M],[money(S.items.reduce((s,i)=>s+i.qty*i.cost,0)),W-M,'right']]);
 sec('Операции ('+S.tx.length+')');
 if(!S.tx.length)ln([['Операций нет',M,'left',mut]]);
 S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(t=>ln([[dm(t.date),M,'left',mut],[(t.type==='in'?'Доход':'Расход')+' · '+(t.cat||'—'),250,'left',ink,400],[pname(t.party)||t.note||'',660,'left',mut,270],[(t.type==='in'?'+':'−')+money(t.amt),W-M,'right',t.type==='in'?G:R]],{s:22,h:34}));
 if(S.items.length){sec('Товары и услуги');S.items.forEach(i=>ln([[i.name,M,'left',ink,480],['Цена '+money(i.price),620,'left',mut],[i.qty+' шт.',W-M,'right']],{s:22,h:34}))}
 if(S.parties.length){sec('Напарники и доли');ln([['Напарник',M],['Начислено',720,'right'],['Выплачено',940,'right'],['К выплате',W-M,'right']],{s:20,c:mut,h:34});S.parties.forEach(p=>{const ac=accr(p,S.tx),pd=paid(p);ln([[p.name+' · '+(p.pct||0)+'%',M,'left',ink,420],[money(ac),720,'right'],[money(pd),940,'right',G],[money(Math.max(0,ac-pd)),W-M,'right',R]],{s:22,h:34})})}
 pg.forEach((p,i)=>{const q=p.getContext('2d');q.font='20px system-ui,Arial,sans-serif';q.fillStyle=mut;q.textAlign='center';q.fillText('Стр. '+(i+1)+' из '+pg.length,W/2,H-40)});
 const jp=pg.map(p=>Uint8Array.from(atob(p.toDataURL('image/jpeg',0.85).split(',')[1]),ch=>ch.charCodeAt(0)));
 const te=new TextEncoder(),parts=[],off=[];let n=0;
 const add=b=>{if(typeof b==='string')b=te.encode(b);parts.push(b);n+=b.length};
 const ob=(id,s,st)=>{off[id]=n;add(id+' 0 obj\n'+s+'\n');if(st){add('stream\n');add(st);add('\nendstream\n')}add('endobj\n')};
 add('%PDF-1.4\n');
 ob(1,'<</Type/Catalog/Pages 2 0 R>>');
 ob(2,`<</Type/Pages/Count ${jp.length}/Kids[${jp.map((_,i)=>(3+3*i)+' 0 R').join(' ')}]>>`);
 jp.forEach((j,i)=>{const p=3+3*i,cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
  ob(p,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 ${p+2} 0 R>>>>/Contents ${p+1} 0 R>>`);
  ob(p+1,`<</Length ${cs.length}>>`,cs);
  ob(p+2,`<</Type/XObject/Subtype/Image/Width ${W}/Height ${H}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.length}>>`,j)});
 const N=3+3*jp.length,xr=n;
 add(`xref\n0 ${N}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${N}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
 const bl=new Blob(parts,{type:'application/pdf'}),fn='uchet-'+today()+'.pdf';
 if(DL)DL.save({filename:fn,data:bl}).catch(e=>{if(!e||e.code!=='declined')alert('Не удалось сохранить PDF.')});
 else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fn;a.click()}
}

}
